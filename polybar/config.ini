; NEW BACKEND-AGNOSTIC NETWORK MODULE
;==========================================================

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/iwd-status.sh
interval = 5
label = %output%
; click-left = ~/.config/polybar/scripts/rofi-iwd-wifi-menu.sh

[module/date]
type = internal/date
interval = 5

date = %a %d %b  %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini


; rog-tune: camera — a red camera while any app has the webcam open (hidden otherwise); set by the display agent
[module/camera]
type = custom/ipc
hook-0 = ~/.config/scripts/camera.sh bar
initial = 1
