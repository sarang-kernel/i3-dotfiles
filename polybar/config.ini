[colors]
base = #1c1917
mantle = #14110f
crust = #0f0d0c
text = #e7dfd3
subtext0 = #b5aa9a
subtext1 = #cfc5b5
surface0 = #2b2622
surface1 = #3a342e
surface2 = #4a4239
overlay0 = #6e655a
overlay1 = #857b6e
overlay2 = #9b9084
blue = #d4a373
lavender = #e0b88a
sapphire = #c99a6b
sky = #d9b48f
teal = #b8a58a
green = #a3a27a
yellow = #e5c07b
peach = #e39a5f
maroon = #c8786a
red = #e06c5a
mauve = #e0a458
pink = #d98c7a
flamingo = #e6b3a1
rosewater = #f0d9c8
transparent = #FF00000

;==========================================================
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar
;
;   The README contains a lot of information
;
;==========================================================

[colors]
background = ${colors.base}
background-alt = ${colors.blue}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.mantle}
alert = ${colors.red}
disabled = ${colors.subtext1}

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 18pt
radius = 0

background = #d9000000
foreground = ${colors.foreground}

bottom = true
line-size = 2pt

border-top-size = 5pt
border-bottom-size = 5pt
border-color = #d9000000

padding-left = 1
padding-right = 2

module-margin = 2

separator = ""
separator-foreground = ${colors.flamingo}

font-0 = MesloLGS Nerd Font Mono:size=14;6

modules-left = xworkspaces xwindow
modules-right = pulseaudio brightness battery memory cpu network mic    camera

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

modules-center = date
font-1 = JetBrains Mono:weight=light:size=12;4
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %{T2}%name%%{T-}
label-active-background = ${colors.mauve}
label-active-foreground = ${colors.crust}
label-active-underline= ${colors.lavender}
label-active-padding = 1

label-occupied = %{T2}%name%%{T-}
label-occupied-padding = 1

label-urgent = %{T2}%name%%{T-}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %{T2}%name%%{T-}
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted =   muted
label-muted-foreground = ${colors.disabled}

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/bri-follow.sh
format = <label>
label = %output%

click-left = brightnessctl -d nvidia_wmi_ec_backlight set 100%
scroll-up = ~/.config/scripts/osd.sh bri up1
scroll-down = ~/.config/scripts/osd.sh bri down1

tail = true
[module/mic]
type = custom/script
exec = ~/.config/polybar/scripts/mic-follow.sh
format = <label>
label = %output%

click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

tail = true
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

click-left = ~/.config/scripts/sysmon.sh
[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

click-left = ~/.config/scripts/sysmon.sh
[module/battery]
type = internal/battery

battery = BAT0
adapter = AC0

poll-interval = 5
full-at = 99
low-at = 5

format-prefix = ""
format-prefix-foreground = ${colors.primary}

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full =   <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = Full

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750
animation-charging-foreground = ${colors.peach}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

