# pacman configuration used by rog-restore (pacstrap -C): only the repository on this ISO, no network.
# SigLevel Never: the new system has no keyring yet at this point; every package was signature-checked when it was downloaded
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Never
LocalFileSigLevel = Never

[rogrepo]
SigLevel = Never
Server = file:///opt/rog/repo
