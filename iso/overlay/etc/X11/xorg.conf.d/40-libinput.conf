Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"

    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "TappingButtonMap" "lmr"    # 1-finger=left, 2-finger=right, 3-finger=middle (taps)
    Option "ClickMethod" "clickfinger"
    Option "NaturalScrolling" "false"
EndSection

